name: CI

# CI base (Fase 0 · A4-R1). v1 = typecheck (verde estable).
# Próximo: sumar `lint` y `build` cuando A4-R2 arregle el lint real y se
# configuren los secrets públicos de Supabase para el build.

on:
  push:
    branches: [supabase-refundacion, main]
  pull_request:
    branches: [supabase-refundacion, main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit; smoke se saltea sin server)
        run: npm test
